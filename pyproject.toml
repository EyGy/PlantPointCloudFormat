[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plant-point-cloud-format"
version = "1.0.0"
description = "Reference implementation for the Plant Point Cloud Format (PPF)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Andreas Gilson", email = "andreas.gilson@iis.fraunhofer.com" },
]
keywords = ["point-cloud", "plant-phenotyping", "ply", "segmentation", "agriculture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/EyGy/PlantPointCloudFormat"
Documentation = "https://github.com/EyGy/PlantPointCloudFormat/blob/main/SPECIFICATION.md"
Repository = "https://github.com/EyGy/PlantPointCloudFormat"
Issues = "https://github.com/EyGy/PlantPointCloudFormat/issues"

[project.scripts]
ppf-validate = "ppf.validate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ppf"]

[tool.pytest.ini_options]
testpaths = ["tests"]